name: 更新 TDX 捷運資料

on:
  schedule:
    - cron: "17 19 1 * *"   # 每月 2 日 03:17（台北時間；GitHub 用 UTC，即每月 1 日 19:17）
  workflow_dispatch:        # 也可以在 GitHub 上手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 從 TDX 抓資料
        run: node fetch-tdx.mjs
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      - name: 有變動才提交
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add metro-data.js tdx-raw tdx-usage.json
          git diff --cached --quiet || git commit -m "更新 TDX 捷運資料"
          git push
